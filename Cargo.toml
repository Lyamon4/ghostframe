[package]
name = "ghostframe"
version = "0.1.0"
edition = "2021"
description = "Open-source frame generation for any game: GPU motion estimation and frame interpolation, no proprietary bits."
license = "MIT"

[workspace]
members = [".", "layer"]

[dependencies]
anyhow = "1"
bytemuck = { version = "1", features = ["derive"] }
clap = { version = "4.6", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png"] }
pollster = "1"
wgpu = "30"
winit = "0.30"

[profile.release]
opt-level = 3
