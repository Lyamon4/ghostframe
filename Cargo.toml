[package]
name = "ghostframe"
version = "0.1.0"
edition = "2021"
description = "Open-source frame generation for any game: GPU motion estimation and frame interpolation, no proprietary bits."
license = "MIT"
default-run = "ghostframe"

[workspace]
members = [".", "layer"]

[dependencies]
anyhow = "1"
bytemuck = { version = "1", features = ["derive"] }
clap = { version = "4.6", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png"] }
pollster = "1"
wgpu = "30"
winit = "0.30"

[build-dependencies]
embed-resource = "3"

[target.'cfg(windows)'.dependencies]
tray-icon = "0.26"
sys-locale = "0.3"
serde_json = "1"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_Security", "Win32_System_Console"] }

[profile.release]
opt-level = 3
